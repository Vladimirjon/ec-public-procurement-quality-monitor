name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    # PostgreSQL 18 for the integration tests (ADR 0007). The password is a
    # fixed placeholder, not a secret: the service lives only for this job.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ecpq_ci
          POSTGRES_USER: ecpq_ci
          POSTGRES_PASSWORD: ci-placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecpq_ci -d ecpq_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # The integration fixtures read these variables. CI is "true" on GitHub
    # Actions, so a missing database fails the job instead of skipping tests.
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ecpq_ci
      POSTGRES_USER: ecpq_ci
      POSTGRES_PASSWORD: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest --cov=ec_procurement_quality --cov-report=term-missing
